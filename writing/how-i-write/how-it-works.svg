<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="440" fill="#0f1117"/>

  <text x="480" y="40" text-anchor="middle" fill="#e8eaf0" font-size="22" font-weight="600">When was that?</text>
  <text x="480" y="66" text-anchor="middle" fill="#8b90a0" font-size="15">Four tables from the Memoirs database, and the rows that dated the DEC terminal</text>

  <!-- Links (drawn first, under the tables) -->
  <g stroke="#2a2d3a" stroke-width="2" fill="none">
    <path d="M480,167 L520,167"/>
    <path d="M480,269 L520,269"/>
    <path d="M720,167 L680,167"/>
  </g>
  <g stroke="#4f8ef7" stroke-width="2.5" fill="none">
    <path d="M220,235 C240,235 240,201 260,201"/>
    <path d="M480,201 L520,201"/>
    <path d="M480,235 L520,235"/>
    <path d="M720,201 C700,201 700,235 680,235"/>
    <path d="M720,235 L680,235" stroke="#2a2d3a" stroke-width="2"/>
  </g>

  <!-- Table: cars -->
  <g font-size="14">
    <rect x="20" y="110" width="200" height="176" rx="8" fill="#1a1d27" stroke="#2a2d3a"/>
    <rect x="20" y="110" width="200" height="40" rx="8" fill="#232735"/>
    <text x="36" y="136" fill="#e8eaf0" font-weight="600" font-size="15">cars</text>
    <text x="204" y="136" fill="#8b90a0" font-size="12" text-anchor="end">26 rows</text>
    <text x="36" y="172" fill="#8b90a0">1967 Fiat Dino</text>
    <text x="36" y="206" fill="#8b90a0">1970 Porsche 914</text>
    <rect x="24" y="220" width="192" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="36" y="240" fill="#e8eaf0">1972 Porsche 911T</text>
    <text x="36" y="274" fill="#8b90a0">1974 Porsche 914</text>
  </g>

  <!-- Table: home -->
  <g font-size="14">
    <rect x="260" y="110" width="220" height="176" rx="8" fill="#1a1d27" stroke="#2a2d3a"/>
    <rect x="260" y="110" width="220" height="40" rx="8" fill="#232735"/>
    <text x="276" y="136" fill="#e8eaf0" font-weight="600" font-size="15">home</text>
    <text x="464" y="136" fill="#8b90a0" font-size="12" text-anchor="end">55 rows</text>
    <text x="276" y="172" fill="#8b90a0">Oxford Dr</text>
    <rect x="264" y="186" width="212" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="276" y="206" fill="#e8eaf0">Dartmouth</text>
    <rect x="264" y="220" width="212" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="276" y="240" fill="#e8eaf0">Alexander Ave</text>
    <text x="276" y="274" fill="#8b90a0">House north of town (fire)</text>
  </g>

  <!-- Table: year -->
  <g font-size="14">
    <rect x="520" y="110" width="160" height="176" rx="8" fill="#1a1d27" stroke="#2a2d3a"/>
    <rect x="520" y="110" width="160" height="40" rx="8" fill="#232735"/>
    <text x="536" y="136" fill="#e8eaf0" font-weight="600" font-size="15">year</text>
    <text x="664" y="136" fill="#8b90a0" font-size="12" text-anchor="end">76 rows</text>
    <text x="536" y="172" fill="#8b90a0">1974–75</text>
    <rect x="524" y="186" width="152" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="536" y="206" fill="#e8eaf0">1975–76</text>
    <rect x="524" y="220" width="152" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="536" y="240" fill="#e8eaf0">1976–77</text>
    <text x="536" y="274" fill="#8b90a0">1977–78</text>
  </g>

  <!-- Table: work -->
  <g font-size="14">
    <rect x="720" y="110" width="220" height="176" rx="8" fill="#1a1d27" stroke="#2a2d3a"/>
    <rect x="720" y="110" width="220" height="40" rx="8" fill="#232735"/>
    <text x="736" y="136" fill="#e8eaf0" font-weight="600" font-size="15">work</text>
    <text x="924" y="136" fill="#8b90a0" font-size="12" text-anchor="end">32 rows</text>
    <text x="736" y="172" fill="#8b90a0">Nuclear Eng. dept, card puncher</text>
    <rect x="724" y="186" width="212" height="30" rx="4" fill="#4f8ef7" fill-opacity="0.15"/>
    <text x="736" y="206" fill="#e8eaf0">Seed corn surveys (the DEC)</text>
    <text x="736" y="240" fill="#8b90a0">Tropical plant business</text>
  </g>

  <!-- Notes -->
  <g font-size="13" fill="#8b90a0">
    <text x="120" y="316" text-anchor="middle">Garry's email:</text>
    <text x="120" y="334" text-anchor="middle">"sold you in 1975"</text>
    <text x="600" y="316" text-anchor="middle">school years,</text>
    <text x="600" y="334" text-anchor="middle">September to May</text>
  </g>

  <text x="480" y="384" text-anchor="middle" fill="#8b90a0" font-size="14">Lines are the database's own links: a car points to a home; homes and jobs point to a year.</text>
  <text x="480" y="406" text-anchor="middle" fill="#8b90a0" font-size="14">The 911T fixes Dartmouth at 1975. Alexander came next, and the DEC with it.</text>
</svg>
