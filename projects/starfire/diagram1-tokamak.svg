<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="480" height="520" fill="#0f1117"/>

  <!-- shield ring (donut) -->
  <circle cx="240" cy="230" r="185" fill="#3a3f4f" stroke="#565d70" stroke-width="2"/>
  <circle cx="240" cy="230" r="135" fill="#0f1117" stroke="#565d70" stroke-width="2"/>

  <!-- plasma glow -->
  <circle cx="240" cy="230" r="95" fill="#ffb380" opacity="0.12"/>
  <circle cx="240" cy="230" r="80" fill="#ffb380" opacity="0.18"/>
  <circle cx="240" cy="230" r="62" fill="#ff8c42"/>
  <text x="240" y="224" text-anchor="middle" fill="#2a1000" font-size="15" font-weight="700">PLASMA</text>
  <text x="240" y="244" text-anchor="middle" fill="#2a1000" font-size="12">150,000,000&#176;C</text>

  <!-- gap cut in shield, top -->
  <path d="M 225 45 L 255 45 L 255 95 L 225 95 Z" fill="#0f1117" stroke="#565d70" stroke-width="1.5"/>

  <!-- radiation arrow through gap -->
  <line x1="240" y1="95" x2="240" y2="15" stroke="#ffd166" stroke-width="4"/>
  <polygon points="240,2 250,20 230,20" fill="#ffd166"/>

  <text x="240" y="46" text-anchor="middle" fill="#ffd166" font-size="15" font-weight="700">radiation leaking</text>
  <text x="240" y="63" text-anchor="middle" fill="#ffd166" font-size="15" font-weight="700">through the gap</text>

  <text x="240" y="472" text-anchor="middle" fill="#8b90a0" font-size="15">the SHIELD — built in sections,</text>
  <text x="240" y="493" text-anchor="middle" fill="#8b90a0" font-size="15">with gaps left between them</text>

  <text x="240" y="518" text-anchor="middle" fill="#e8eaf0" font-size="14" font-style="italic">A tokamak, seen from above (simplified)</text>
</svg>
