<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="720" height="460" fill="#0f1117"/>

  <text x="360" y="26" text-anchor="middle" fill="#e8eaf0" font-size="18" font-weight="700">Why the gap needs to zigzag</text>
  <text x="360" y="45" text-anchor="middle" fill="#8b90a0" font-size="13">Cross-section through the shield (simplified)</text>

  <!-- ================= TOP PANEL: straight gap ================= -->
  <text x="360" y="66" text-anchor="middle" fill="#8b90a0" font-size="13">Straight gap — three shield sections, gap runs straight through</text>

  <!-- shield zones (source-side, mid, exit-side) -->
  <rect x="200" y="80" width="150" height="110" fill="#3a3f4f" stroke="#565d70" stroke-width="1.5"/>
  <rect x="350" y="80" width="120" height="110" fill="#33384a" stroke="#565d70" stroke-width="1.5"/>
  <rect x="470" y="80" width="90"  height="110" fill="#2c303f" stroke="#565d70" stroke-width="1.5"/>

  <!-- gap channel cut straight through all three sections -->
  <rect x="200" y="120" width="360" height="30" fill="#0f1117"/>
  <line x1="200" y1="120" x2="560" y2="120" stroke="#565d70" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="200" y1="150" x2="560" y2="150" stroke="#565d70" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- neutron path: straight through and out -->
  <line x1="140" y1="135" x2="580" y2="135" stroke="#ffd166" stroke-width="4"/>
  <polygon points="596,135 578,125 578,145" fill="#ffd166"/>

  <text x="140" y="105" text-anchor="middle" fill="#8b90a0" font-size="11">source</text>
  <text x="596" y="105" text-anchor="middle" fill="#8b90a0" font-size="11">detector</text>
  <text x="380" y="215" text-anchor="middle" fill="#ffd166" font-size="14" font-weight="700">direct streaming path &#8212; neutrons pass straight through</text>

  <!-- ================= BOTTOM PANEL: staggered gap ================= -->
  <text x="360" y="255" text-anchor="middle" fill="#8b90a0" font-size="13">Staggered gap — offset at every section boundary</text>

  <rect x="200" y="275" width="150" height="110" fill="#3a3f4f" stroke="#565d70" stroke-width="1.5"/>
  <rect x="350" y="275" width="120" height="110" fill="#33384a" stroke="#565d70" stroke-width="1.5"/>
  <rect x="470" y="275" width="90"  height="110" fill="#2c303f" stroke="#565d70" stroke-width="1.5"/>

  <!-- gap channel: straight through section 1, then jogs down at each boundary -->
  <rect x="200" y="300" width="150" height="26" fill="#0f1117"/>
  <rect x="350" y="330" width="120" height="26" fill="#0f1117"/>
  <rect x="470" y="360" width="90"  height="26" fill="#0f1117"/>

  <!-- neutron path: enters aligned with section-1 gap, travels straight, hits solid wall of section 2 -->
  <line x1="140" y1="313" x2="350" y2="313" stroke="#ffd166" stroke-width="4"/>

  <!-- blocked marker at the corner -->
  <circle cx="350" cy="313" r="12" fill="none" stroke="#e03c3c" stroke-width="3"/>
  <line x1="341" y1="304" x2="359" y2="322" stroke="#e03c3c" stroke-width="3"/>
  <line x1="359" y1="304" x2="341" y2="322" stroke="#e03c3c" stroke-width="3"/>

  <text x="140" y="300" text-anchor="middle" fill="#8b90a0" font-size="11">source</text>
  <text x="380" y="410" text-anchor="middle" fill="#e03c3c" font-size="14" font-weight="700">no direct path &#8212; neutrons must scatter to get out</text>
</svg>
